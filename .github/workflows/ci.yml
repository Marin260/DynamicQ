name: CI

on:
  push:
    branches:
      - master
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore DynamicQ.sln

      - name: Build
        run: dotnet build DynamicQ.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DynamicQ.sln --configuration Release --no-build --logger trx

      - name: Pack and validate package
        run: >
          dotnet pack DynamicQ/DynamicQ.csproj
          --configuration Release
          --no-build
          --output artifacts/package
          -p:EnablePackageValidation=true

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicQ-package
          path: artifacts/package/*
