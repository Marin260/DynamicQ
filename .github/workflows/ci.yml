name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore DynamicQ.sln

      - name: Build
        run: dotnet build DynamicQ.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DynamicQ.sln --configuration Release --no-build --logger trx

      - name: Pack and validate package
        run: >
          dotnet pack DynamicQ/DynamicQ.csproj
          --configuration Release
          --no-build
          --output artifacts/package
          -p:EnablePackageValidation=true

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicQ-package
          path: artifacts/package/*

  publish:
    needs: build-test-pack
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on master
        run: |
          git fetch origin master --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/master"

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: DynamicQ-package
          path: artifacts/package

      - name: NuGet login with Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        run: >
          dotnet nuget push artifacts/package/*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
